source: "원문 기반 기술 검토 2026-11-05, docs/api-notes.md 심사기준 검토"
interview_gap: 1.5
inactivity_days: 90
cost_window_days: 30
usage_window_days: 30
required_retention_days: null
internal_security_score_min: null
model_policy_definition_ids: []
overprivileged_permissions_sample: true
overprivileged_permission_patterns: ["*.ReadWrite.All", "*.Write.All", "*FullControl*"]
configuration_grading:
  level: L2
  minimum_observations: 1
  items:
    BI-SY-11: "완료된 평가 기록 조회, 운영 버전의 배포 전 평가 귀속은 추가 검증"
    BI-SY-12: "보안 권고 또는 보안 점수 조회, AI 점검 범위·내부 목표는 추가 검증"
    OE-SY-22: "Agent 리소스의 활성 로그 설정 조회, 테이블별 유효 보존기간은 추가 검증"
    OT-SY-28: "실제 수치 표본이 있는 리소스 사용량 조회, Agent별 90일 미사용 여부는 추가 검증"
    DS-SY-05: "Blueprint 정의 존재, 주요 유형 표준화는 추가 검증"
    DS-SY-07: "HTTPS·접근 제한 등 기본 네트워크 보호 설정 확인, 경계 차단 효과는 추가 검증"
    DS-SY-08: "도구 정의 조회, 고위험 호출의 필수 승인·거부는 추가 검증"
    DS-SY-09: "외부 도구 호스트 식별, 승인 목록·인증·송신 차단은 추가 검증"
    BI-SY-13: "모델 배포의 콘텐츠 필터 정책 연결 확인, 실제 차단 효과는 추가 검증"
    BI-SY-14: "모델 버전 또는 호스트 런타임 식별, 승인 버전·업데이트 절차는 추가 검증"
    BI-SY-16: "리소스 정책 평가 결과 조회, 예외 승인·편차 해소는 추가 검증"
    OE-SY-23: "관리 ID 연결 확인, 실제 인증 사용·전체 유효 권한은 추가 검증"
    OE-SY-24: "대상 AI 리소스의 활성 경보 확인, 계측·SLO·대응 효과는 추가 검증"
    OE-SY-25: "경보와 작업 그룹 연결 확인, 실제 수신·중단·복구는 추가 검증"
    OE-SY-26: "리소스 지역 또는 보존 설정 조회, 승인 지역·실제 처리·삭제는 추가 검증"
items:
  DS-SY-06:
    scope: in_scope
    metric: allowed_ratio
    levels:
      L1: "허용 모델 기준이 없음을 증적으로 확인"
      L2: "허용 모델 일치율 90% 미만"
      L3: "배포 모델의 90% 이상이 허용 모델 목록과 일치함"
      L4: "허용 외 모델 배포 0건, 정책으로 배포 자체가 제한됨"
      L5: "L4 충족, 사용량·성능·퇴역 일정으로 교체·폐기 개선"
    rules:
      - level: L5
        when: {allowed_ratio: {eq: 1}, model_policy_enforced: {eq: true}, model_lifecycle_optimized: {eq: true}}
      - level: L4
        when: {allowed_ratio: {eq: 1}, model_policy_enforced: {eq: true}}
      - level: L3
        when: {allowed_ratio: {gte: 0.9}}
      - level: L2
        when: {allowed_ratio: {lt: 0.9}}
      - level: L1
        when: {declared_no_allowlist: {eq: true}}
  BI-SY-11:
    scope: in_scope
    metric: evaluated_ratio
    levels:
      L1: "운영 대상 전체 확인, 배포 전 평가 이력 보유율 0%"
      L2: "배포 전 평가 0% 초과~80% 미만 또는 완료된 평가 기록 확인(배포 귀속 미검증)"
      L3: "운영 Agent의 80% 이상이 배포 전 평가 이력을 보유함"
      L4: "배포 Agent 100% 평가, 파이프라인에서 자동 실행됨"
      L5: "L4 충족, 지속 평가·자동 경보와 품질 개선 이력"
    rules:
      - level: L5
        when: {evaluated_ratio: {eq: 1}, pipeline_evaluation: {eq: true}, continuous_evaluation_alerts: {eq: true}, evaluation_improvement_verified: {eq: true}}
      - level: L4
        when: {evaluated_ratio: {eq: 1}, pipeline_evaluation: {eq: true}}
      - level: L3
        when: {evaluated_ratio: {gte: 0.8}}
      - level: L2
        when: {evaluated_ratio: {gt: 0, lt: 0.8}}
      - level: L1
        when: {evaluated_ratio: {eq: 0}}
      - level: L1
        when: {evaluation_history_count: {eq: 0}, evaluation_history_complete: {eq: true}}
  BI-SY-12:
    scope: partial
    metric: high_risk_recommendations
    levels:
      L1: "AI 워크로드 보안 태세 점검 기능 미사용"
      L2: "보안 권고·점수 조회 또는 점검 활성이나 고위험 권고·내부 목표 미달"
      L3: "고위험 권고 0건, 보안 점수가 내부 기준 이상 유지됨"
      L4: "L3 충족, 30일 내 조치 이력과 보안 정책 자동 적용 확인"
      L5: "L4 충족, 공격 경로 분석과 위험 자동 조치 개선 이력"
    rules:
      - level: L5
        when: {high_risk_recommendations: {eq: 0}, security_score_meets_internal: {eq: true}, security_policy_automated: {eq: true}, recommendation_sla_verified: {eq: true}, continuous_attack_path_remediation: {eq: true}, security_improvement_verified: {eq: true}}
      - level: L4
        when: {high_risk_recommendations: {eq: 0}, security_score_meets_internal: {eq: true}, security_policy_automated: {eq: true}, recommendation_sla_verified: {eq: true}}
      - level: L3
        when: {high_risk_recommendations: {eq: 0}, security_score_meets_internal: {eq: true}}
      - level: L2
        when: {security_feature_enabled: {eq: true}, high_risk_recommendations: {gt: 0}}
      - level: L2
        when: {security_feature_enabled: {eq: true}, security_score_meets_internal: {eq: false}}
      - level: L1
        when: {security_feature_enabled: {eq: false}}
  OE-SY-22:
    scope: partial
    metric: retention_days
    levels:
      L1: "Agent 활동 감사 로그 미수집"
      L2: "활성 로그 설정 확인, 유효 보존기간·승인 기준 미검증 또는 미달"
      L3: "대상 테이블의 유효 보존기간이 승인 기준 이상"
      L4: "L3 충족, 보존 정책 100% 적용과 정기 리포트 자동 생성"
      L5: "L4 충족, 감사 이상 활동 자동 경보와 개선 이력"
    rules:
      - level: L5
        when: {retention_scope_verified: {eq: true}, retention_meets_internal: {eq: true}, retention_policy_coverage: {eq: 1}, automatic_audit_reports: {eq: true}, continuous_audit_alerts: {eq: true}, audit_improvement_verified: {eq: true}}
      - level: L4
        when: {retention_scope_verified: {eq: true}, retention_meets_internal: {eq: true}, retention_policy_coverage: {eq: 1}, automatic_audit_reports: {eq: true}}
      - level: L3
        when: {retention_scope_verified: {eq: true}, retention_meets_internal: {eq: true}}
      - level: L2
        when: {retention_scope_verified: {eq: true}, logs_collected: {eq: true}, retention_meets_internal: {eq: false}}
      - level: L1
        when: {logs_collected: {eq: false}}
  OT-SY-28:
    scope: partial
    metric: inactive_ratio
    levels:
      L1: "사용 현황 관리 절차가 없음을 증적으로 확인"
      L2: "리소스 사용량 표본 확인(Agent별 90일 판정 미검증) 또는 90일 미사용 비율 20% 이상"
      L3: "90일 미사용 Agent 비율 20% 미만"
      L4: "미사용 비율 10% 미만, 미사용 Agent가 자동 알림·정리됨"
      L5: "미사용 5% 미만 유지, 사용 추세로 확대·폐기를 결정함"
    rules:
      - level: L5
        when: {inactive_ratio: {lt: 0.05}, inactivity_automatic_cleanup: {eq: true}, usage_lifecycle_optimized: {eq: true}}
      - level: L4
        when: {inactive_ratio: {lt: 0.1}, inactivity_automatic_cleanup: {eq: true}}
      - level: L3
        when: {inactive_ratio: {lt: 0.2}}
      - level: L2
        when: {inactive_ratio: {gte: 0.2}}
      - level: L1
        when: {usage_management_absent: {eq: true}}
  OT-SY-29:
    scope: partial
    metric: attributable_cost_ratio
    levels:
      L1: "비용 관리·배분 기준이 없음을 증적으로 확인"
      L2: "과금 정책은 있으나 Agent별 비용 식별률 80% 미만"
      L3: "최근 30일 비용의 80% 이상 Agent 귀속, 기간별 집계 가능"
      L4: "비용 100% 식별, 조직별 배분·예산 경보가 자동 적용됨"
      L5: "L4 충족, 비용 예측·선제 조치와 예측 오차 개선 이력"
    rules:
      - level: L5
        when: {attributable_cost_ratio: {eq: 1}, monthly_cost_aggregation: {eq: true}, cost_allocation_budget_alerts: {eq: true}, cost_forecast_control: {eq: true}, cost_improvement_verified: {eq: true}}
      - level: L4
        when: {attributable_cost_ratio: {eq: 1}, monthly_cost_aggregation: {eq: true}, cost_allocation_budget_alerts: {eq: true}}
      - level: L3
        when: {attributable_cost_ratio: {gte: 0.8}, monthly_cost_aggregation: {eq: true}}
      - level: L2
        when: {usage_billing_policy: {eq: true}, attributable_cost_ratio: {lt: 0.8}}
      - level: L1
        when: {declared_no_billing_policy: {eq: true}}
  DS-SY-05:
    scope: in_scope
    requires: entra
    metric: blueprint_count
    levels:
      L1: "Agent ID 미사용 또는 Blueprint 정의 0개"
      L2: "Blueprint 존재, 주요 유형 표준 미검증 또는 적용률 50% 미만"
      L3: "주요 유형별 Blueprint 정의, 수집 Agent ID의 50% 이상 연결"
      L4: "주요 유형별 정의, 수집 Agent ID의 90% 이상 연결"
      L5: "Blueprint 사용 데이터로 템플릿을 정기 개정, 적용률 100% 유지"
    rules:
      - level: L5
        when: {blueprint_based_ratio: {eq: 1}, major_type_blueprints_defined: {eq: true}, blueprint_periodic_review: {eq: true}}
      - level: L4
        when: {blueprint_based_ratio: {gte: 0.9}, major_type_blueprints_defined: {eq: true}}
      - level: L3
        when: {blueprint_based_ratio: {gte: 0.5}, major_type_blueprints_defined: {eq: true}}
      - level: L2
        when: {blueprint_count: {gt: 0}, blueprint_based_ratio: {lt: 0.5}}
      - level: L2
        when: {blueprint_count: {gt: 0}, major_type_blueprints_defined: {eq: false}}
      - level: L1
        when: {blueprint_count: {eq: 0}}
  DP-SY-19:
    scope: partial
    requires: entra
    metric: agent_id_ratio
    levels:
      L1: "Agent ID 미사용, 부여율 0%"
      L2: "Agent ID 부여율 0% 초과~80% 미만"
      L3: "Agent ID 부여율 80% 이상"
      L4: "부여율 95% 이상, 신규 Agent는 생성 시 자동 부여됨"
      L5: "L4 충족, 부여율 100%와 미부여 자동 대응·절차 개선 이력"
    rules:
      - level: L5
        when: {agent_id_ratio: {eq: 1}, agent_id_auto_assigned: {eq: true}, unassigned_agent_auto_remediation: {eq: true}, agent_id_improvement_verified: {eq: true}}
      - level: L4
        when: {agent_id_ratio: {gte: 0.95}, agent_id_auto_assigned: {eq: true}}
      - level: L3
        when: {agent_id_ratio: {gte: 0.8}}
      - level: L2
        when: {agent_id_ratio: {gt: 0, lt: 0.8}}
      - level: L1
        when: {agent_id_ratio: {eq: 0}}
  OE-SY-20:
    scope: in_scope
    requires: entra
    metric: unassigned_ratio
    levels:
      L1: "소유자·후원자 관리 절차가 없음을 증적으로 확인"
      L2: "미지정·고아 Agent 비율 10% 이상"
      L3: "미지정·고아 Agent 비율 10% 미만"
      L4: "미지정·고아 Agent 비율 2% 미만, 수명주기 정책이 자동 적용됨"
      L5: "L4 충족, 고아 0건과 소유자 변경 자동 대응·개선 이력"
    rules:
      - level: L5
        when: {unassigned_ratio: {eq: 0}, lifecycle_policy_automated: {eq: true}, owner_change_automation: {eq: true}, owner_improvement_verified: {eq: true}}
      - level: L4
        when: {unassigned_ratio: {lt: 0.02}, lifecycle_policy_automated: {eq: true}}
      - level: L3
        when: {unassigned_ratio: {lt: 0.1}}
      - level: L2
        when: {unassigned_ratio: {gte: 0.1}}
      - level: L1
        when: {owner_management_absent: {eq: true}}
  OE-SY-21:
    scope: in_scope
    requires: entra
    metric: overprivileged_ratio
    levels:
      L1: "권한 관리 절차가 없음을 증적으로 확인"
      L2: "확인한 부여 권한에서 과다 권한 Agent 비율 5% 이상"
      L3: "과다 권한 Agent 비율 5% 미만"
      L4: "과다 권한 1% 미만, 지원되는 권한의 만료·회수 자동화"
      L5: "L4 충족, 과다 권한 0건과 자동 접근 검토·권한 축소 개선"
    rules:
      - level: L5
        when: {overprivileged_ratio: {eq: 0}, access_package_expiry_automated: {eq: true}, access_review_automated: {eq: true}, permissions_improvement_verified: {eq: true}}
      - level: L4
        when: {overprivileged_ratio: {lt: 0.01}, access_package_expiry_automated: {eq: true}}
      - level: L3
        when: {overprivileged_ratio: {lt: 0.05}}
      - level: L2
        when: {overprivileged_ratio: {gte: 0.05}}
      - level: L1
        when: {permission_management_absent: {eq: true}}
  DS-SY-07:
    scope: partial
    metric: network_control_ratio
    assessment_key: network_assessment
    evidence: "공용 접근·기본 거부·허용 규칙·PE 연결 상태, 호스트 인바운드·송신 시험, 승인 예외"
    levels:
      L1: "대상 확인 완료, 승인된 네트워크 경계 충족률 0%"
      L2: "HTTPS·접근 제한 등 기본 보호 설정 확인 또는 경계 충족률 0% 초과~90% 미만"
      L3: "90% 이상이 승인 경계 충족, 제한 공용 접근·예외는 근거 검증"
      L4: "충족률 100%, 정책·배포 게이트로 편차 차단과 예외 만료 관리"
      L5: "L4 충족, 접근·송신 시험과 로그 분석으로 경계 지속 개선"
    rules:
      - {level: L5, when: {network_control_ratio: {eq: 1}, network_standardized: {eq: true}, network_enforced: {eq: true}, network_improved: {eq: true}}}
      - {level: L4, when: {network_control_ratio: {eq: 1}, network_standardized: {eq: true}, network_enforced: {eq: true}}}
      - {level: L3, when: {network_control_ratio: {gte: 0.9}, network_standardized: {eq: true}}}
      - {level: L2, when: {network_control_ratio: {gt: 0, lt: 0.9}}}
      - {level: L2, when: {network_control_ratio: {gt: 0}, network_standardized: {eq: false}}}
      - {level: L1, when: {network_control_ratio: {eq: 0}}}
  DS-SY-08:
    scope: partial
    metric: tool_approval_ratio
    assessment_key: tool_approval_assessment
    evidence: "고위험 도구 분류·호출별 승인·거부 시험, 실행 주체, 앱·MCP 승인 게이트 이력"
    levels:
      L1: "고위험 도구 대상 확인 완료, 필수 승인 통제 충족률 0%"
      L2: "도구 정의 확인(승인 집행 미검증) 또는 필수 승인 충족률 0% 초과~90% 미만"
      L3: "고위험 도구 호출 경로 90% 이상 승인·거부 통제 검증"
      L4: "충족률 100%, 승인 우회 시험과 릴리스 게이트 운영"
      L5: "L4 충족, 승인·거부·사고 이력으로 자율성 수준 개선"
    rules:
      - {level: L5, when: {tool_approval_ratio: {eq: 1}, tool_approval_standardized: {eq: true}, tool_approval_enforced: {eq: true}, tool_approval_improved: {eq: true}}}
      - {level: L4, when: {tool_approval_ratio: {eq: 1}, tool_approval_standardized: {eq: true}, tool_approval_enforced: {eq: true}}}
      - {level: L3, when: {tool_approval_ratio: {gte: 0.9}, tool_approval_standardized: {eq: true}}}
      - {level: L2, when: {tool_approval_ratio: {gt: 0, lt: 0.9}}}
      - {level: L2, when: {tool_approval_ratio: {gt: 0}, tool_approval_standardized: {eq: false}}}
      - {level: L1, when: {tool_approval_ratio: {eq: 0}}}
  DS-SY-09:
    scope: partial
    metric: endpoint_control_ratio
    assessment_key: endpoint_assessment
    evidence: "승인 엔드포인트·도구·인증 기준, 송신 제한, 실제 연결 시험, 예외 승인 기록"
    levels:
      L1: "외부 연결 대상 확인 완료, 승인 연결 기준 충족률 0%"
      L2: "외부 도구 호스트 식별(승인·차단 미검증) 또는 승인 충족률 0% 초과~90% 미만"
      L3: "연결 90% 이상이 승인 대상·도구·인증 기준 충족"
      L4: "충족률 100%, 게이트웨이·송신 통제로 미승인 연결 차단"
      L5: "L4 충족, 호출 이상·변경 이력으로 허용 범위 개선"
    rules:
