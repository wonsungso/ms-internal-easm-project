[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wasm-agent"
version = "0.1.0"
description = "Read-only Azure/Foundry governance system evidence"
requires-python = ">=3.11"
dependencies = [
  "azure-identity>=1.19,<2",
  "requests>=2.32.4,<3",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "azure-ai-projects>=2.3,<3",
  "openai>=2,<3",
  "cryptography>=44",
  "openpyxl>=3.1.5,<4",
]

[project.scripts]
wasm-agent = "wasm_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]
demo = [
  "Flask>=3,<4",
  "gunicorn>=23,<24",
  "azure-identity>=1.19,<2",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "azure-ai-projects>=2.3,<3",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wasm-agent" = ["config/criteria.yaml", "docs/assessment-result-template.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
