# API 구성 충족률 기준입니다. levels 문장과 rules 조건을 함께 변경하세요.
source: API 구성·기록 기반 평가 2026-11-09 - docs/api-notes.md
grading_profile: api_configuration_v1
interview_gap: 1.5
inactivity_days: 90
cost_window_days: 30
usage_window_days: 30
workspace_retention_target_days: 90
version_upgrade_options:
- NoAutoUpgrade
- OnceNewDefaultVersionAvailable
- OnceCurrentVersionExpired
overprivileged_permission_patterns:
- '*.ReadWrite.All'
- '*.Write.All'
- '*FullControl*'
model_policy_definition_ids: []
items:
  DS-SY-05:
    title: Agent ID의 Blueprint 연결
    scope: in_scope
    metric: blueprint_link_ratio
    denominator: Graph Agent ID 수
    evidence: applications/microsoft.graph.agentIdentityBlueprint와 servicePrincipals/microsoft.graph.agentIdentity의
      agentIdentityBlueprintId 대조
    limit: Blueprint 조직 표준 승인이나 업무 유형 분류를 의미하지 않음
    collectors:
    - entra_agents
    - entra_blueprints
    complete_flags:
    - entra_agents_complete
    - entra_blueprints_complete
    complete_subscriptions: []
    levels:
      L1: Blueprint 연결 비율 0%
      L2: Blueprint 연결 비율 0% 초과~80% 미만
      L3: Blueprint 연결 비율 80% 이상~90% 미만
      L4: Blueprint 연결 비율 90% 이상~100% 미만
      L5: Blueprint 연결 비율 100%
    rules:
    - level: L5
      when:
        coverage:
          eq: 1
    - level: L4
      when:
        coverage:
          gte: 0.9
          lt: 1
    - level: L3
      when:
        coverage:
          gte: 0.8
          lt: 0.9
    - level: L2
      when:
        coverage:
          gt: 0
          lt: 0.8
    - level: L1
      when:
        coverage:
          eq: 0
    requires: entra
